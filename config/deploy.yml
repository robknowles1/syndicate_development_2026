# Kamal base configuration — shared settings plus the PRODUCTION destination.
#
# Staging overlays this file with config/deploy.staging.yml (deep-merged; arrays
# are replaced wholesale, hashes are merged key by key). Deploy staging with:
#
#   bin/kamal deploy -d staging
#
# PRODUCTION IS NOT PROVISIONED VIA KAMAL YET. The apex currently resolves to a
# DigitalOcean host (147.182.199.74) that serves the live site and is not managed
# by this config. The production host below is a deliberate RFC 2606 `.invalid`
# placeholder so that `kamal config` renders while any accidental
# `kamal deploy` (no destination) fails immediately at DNS resolution instead of
# deploying production onto the staging box. Set KAMAL_PRODUCTION_HOST, or replace
# the default, when production is actually provisioned.

# Name of your application. Used to uniquely configure containers.
service: syndicate_development_2026

# Name of the container image. GitHub Container Registry requires the owner
# prefix: the image resolves to ghcr.io/robknowles1/syndicate_development_2026.
image: robknowles1/syndicate_development_2026

# Deploy to these servers.
#
# The `: solid_queue` suffix is an env TAG, not part of the hostname. It attaches
# the env block under `env.tags.solid_queue` below to this host and only this
# host, which is how production gets SOLID_QUEUE_IN_PUMA without staging
# inheriting it. Keep the tag on whichever host is meant to run the Solid Queue
# supervisor; a host listed without it does not run one.
servers:
  web:
    - <%= ENV.fetch("KAMAL_PRODUCTION_HOST", "production-not-provisioned.invalid") %>: solid_queue

# Terminating proxy. THIS BLOCK IS LOAD-BEARING, NOT OPTIONAL.
#
# The environment files set `config.assume_ssl` and `config.force_ssl`. With no
# proxy terminating TLS, Rails reads plaintext requests as secure, `force_ssl`
# stops redirecting, and the admin session cookie is still flagged `Secure` — so
# browsers refuse to send it back and admin login silently fails to persist.
#
# `ssl: true` makes kamal-proxy obtain a Let's Encrypt certificate for `host`.
# That requires `host` to already resolve to this server and port 443 to be
# reachable, so DNS must be pointed BEFORE the first deploy.
#
# Do not add `forward_headers: true`. With `ssl: true` kamal-proxy stops
# forwarding X-Forwarded-* precisely so a client cannot spoof them, and
# `assume_ssl` already tells Rails the connection is secure without those
# headers.
proxy:
  ssl: true
  host: www.syndicate-development.com

# Where you keep your container images.
registry:
  server: ghcr.io
  username: robknowles1

  # Supplied at deploy time from the environment via .kamal/secrets-common.
  # Never commit the token.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets*).
env:
  secret:
    - RAILS_MASTER_KEY
    - RESEND_API_KEY
    - ADMIN_SEED_PASSWORD
    - SYNDICATE_DEVELOPMENT_2026_DATABASE_PASSWORD
  clear:
    # Canonical hostname. Feeds mailer link generation and Host-header
    # authorization — a Host not listed there is rejected with 403.
    APP_HOST: www.syndicate-development.com

    RAILS_LOG_LEVEL: info

    # Sized for the 2 vCPU / 3.7 GB OVH box, not for a larger default.
    # RAILS_MAX_THREADS sets both Puma's thread count and the Active Record pool
    # (config/database.yml reads the same variable), so 2 workers x 5 threads is
    # a ceiling of 10 database connections against Postgres' default limit of 100.
    #
    # Watch that budget when raising either knob alongside the job settings
    # below: each Puma worker holds RAILS_MAX_THREADS primary connections, and
    # each Solid Queue process holds JOB_THREADS + 2 against the queue database.
    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 5

    # Worker threads per Solid Queue process (default: 3). Also sizes the `queue`
    # database pool in config/database.yml, which is set to JOB_THREADS + 2 as
    # Solid Queue requires.
    # JOB_THREADS: 3

    # Number of processes dedicated to Solid Queue (default: 1).
    # JOB_CONCURRENCY: 3

    # SOLID_QUEUE_IN_PUMA IS NOT SET IN THIS SHARED BLOCK, AND MUST NOT BE.
    # It is scoped to the production web host by the `solid_queue` env tag —
    # see the `tags:` block below and the tag on the host under `servers:`.
    #
    # env.clear deep-merges into every destination, and Kamal lets a destination
    # override an inherited key but never remove one. Setting the flag here
    # would therefore hand it to staging as well, and staging must not have it:
    # config/environments/staging.rb leaves the Active Job adapter at :async and
    # staging runs a single primary database with no solid_queue_* tables, so
    # the supervisor would die on boot and Puma's solid_queue plugin would take
    # the Puma master down with it — staging's whole web tier, not just its jobs.

    # CONTACT_RECIPIENT_EMAIL IS DELIBERATELY NOT SET HERE.
    # config/application.rb reads it with `ENV.fetch("CONTACT_RECIPIENT_EMAIL") {
    # Rails.env.production? ? <shop> : <developer> }`. Only the *fallback* is
    # environment-aware: an explicit value wins in every environment. Setting it
    # in this shared block would be inherited by staging via deep merge and route
    # staging's test submissions to the real customer. Leaving it unset lets the
    # env-aware default route production to the shop and staging to the developer.

  # Per-host env, applied only to hosts carrying the matching tag under
  # `servers:`. Unlike `clear:` above, tags do NOT reach a destination that
  # declares its own host list: Kamal deep-merges hashes but replaces arrays
  # wholesale, so a destination's `servers.web` list drops the base's tagged
  # hosts along with the base's hosts. A new destination therefore starts with
  # the supervisor OFF and has to opt in by tagging a host, which is the safe
  # direction to fail. That is what makes this the right home for a flag
  # production needs and staging must not have.
  tags:
    # Runs the Solid Queue supervisor inside this host's Puma process.
    #
    # Required in production: config/environments/production.rb sets
    # `queue_adapter = :solid_queue`, and
    # app/controllers/admin/password_resets_controller.rb enqueues the reset
    # email with `deliver_later`. Without a supervisor those jobs sit in the
    # queue database forever — no error, no failed deploy, no reset email.
    #
    # Accepted tradeoff: this couples job availability to web availability.
    # Puma's solid_queue plugin monitors the supervisor fork and, if it dies,
    # issues Process.kill(:INT, $$) on the Puma master — so a queue failure
    # takes the public site down with it. That is backwards in principle for a
    # marketing site, where the site is the product and email is secondary, but
    # a dedicated job host means paying for a second server to run what is
    # currently only contact-form and password-reset email. Kamal restarts the
    # container on exit, so the realistic failure mode is a restart rather than
    # a sustained outage.
    #
    # When that tradeoff stops being acceptable, add a `job:` role under
    # `servers:` with `cmd: bin/jobs`, tag the job host with `solid_queue`, and
    # drop the tag from web. Moving one tag is the whole change.
    solid_queue:
      clear:
        # config/puma.rb tests `== "true"`, so this value is load-bearing rather
        # than merely present. Any other value leaves the supervisor off.
        SOLID_QUEUE_IN_PUMA: "true"

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Named Docker volume for Active Storage uploads (config.active_storage.service
# is :local). Named rather than a host bind mount so Docker owns the permissions
# and the data survives redeploys.
volumes:
  - "syndicate_development_2026_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder. Both this workstation and the OVH box are x86_64,
# so amd64 builds natively — no QEMU emulation.
builder:
  arch: amd64

# Root SSH login is disabled on the OVH Ubuntu image (PermitRootLogin no), and
# Kamal defaults to root. Without this every command fails with a bare
# "Permission denied" that looks like a bad key.
ssh:
  user: ubuntu

# Postgres runs as a Kamal accessory on the same box.
#
# Accessories are NOT redeployed with the app — `kamal deploy` leaves a running
# accessory alone. Boot or reboot it explicitly with `kamal accessory boot db`.
accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("KAMAL_PRODUCTION_HOST", "production-not-provisioned.invalid") %>

    # Bound to loopback ONLY. ufw is inactive on the box, so publishing on
    # 0.0.0.0 would put Postgres directly on the public internet. Loopback still
    # allows psql/pg_dump from the host over an SSH tunnel; the app itself does
    # not use this mapping — it reaches the container by name on the `kamal`
    # Docker network.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        # POSTGRES_USER is created by initdb as a superuser, which is what lets
        # `db:prepare` create the databases it needs without a separate CREATEDB
        # grant. POSTGRES_DB pre-creates the primary database on first boot.
        POSTGRES_USER: syndicate_development_2026
        POSTGRES_DB: syndicate_development_2026_production
      secret:
        - POSTGRES_PASSWORD

    # Named volume, not a `directories:` bind mount. A bind mount is created on
    # the host owned by the SSH user, and initdb (running as uid 999 inside the
    # image) cannot write to it. A named volume inherits the image's ownership.
    volumes:
      - "syndicate_development_2026_pgdata:/var/lib/postgresql/data"
