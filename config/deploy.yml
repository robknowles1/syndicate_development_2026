# Kamal base config plus the PRODUCTION destination; config/deploy.staging.yml
# overlays it. Runbook: docs/deployment/ovh-server-access.md.

service: syndicate_development_2026

image: robknowles1/syndicate_development_2026

# The `: solid_queue` suffix is an env TAG, not a stray colon in the hostname.
# Removing it silently stops the Solid Queue supervisor from ever starting.
servers:
  web:
    - <%= ENV.fetch("KAMAL_PRODUCTION_HOST", "production-not-provisioned.invalid") %>: solid_queue

# Do not remove this block, and do not add `forward_headers: true`. It is the
# other half of `config.assume_ssl` in config/environments/production.rb: without
# a terminating proxy admin login silently fails to persist, and forwarding
# X-Forwarded-* under `ssl: true` lets a client spoof them.
proxy:
  ssl: true
  host: www.syndicate-development.com

registry:
  server: ghcr.io
  username: robknowles1
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - RESEND_API_KEY
    - ADMIN_SEED_PASSWORD
    - SYNDICATE_DEVELOPMENT_2026_DATABASE_PASSWORD
  # Nothing added here can be kept off staging: `clear:` deep-merges into every
  # destination, and a destination can override an inherited key but never remove
  # it. SOLID_QUEUE_IN_PUMA is absent for that reason and must stay absent — it
  # is scoped to the production host by the tag below.
  clear:
    APP_HOST: www.syndicate-development.com

    RAILS_LOG_LEVEL: info

    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 5

  tags:
    solid_queue:
      clear:
        SOLID_QUEUE_IN_PUMA: "true"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "syndicate_development_2026_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: ubuntu

accessories:
  db:
    image: postgres:16
    host: <%= ENV.fetch("KAMAL_PRODUCTION_HOST", "production-not-provisioned.invalid") %>

    # Loopback ONLY. ufw is inactive on the box, so widening this to 0.0.0.0
    # publishes Postgres straight to the internet. The app does not use this
    # mapping — it reaches the container by name on the `kamal` network.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: syndicate_development_2026
        POSTGRES_DB: syndicate_development_2026_production
      secret:
        - POSTGRES_PASSWORD

    volumes:
      - "syndicate_development_2026_pgdata:/var/lib/postgresql/data"
