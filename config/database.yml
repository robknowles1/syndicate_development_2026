# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: syndicate_development_2026_development

  # The specified database role being used to connect to PostgreSQL.
  # To create additional roles in PostgreSQL see `$ createuser --help`.
  # When left blank, PostgreSQL will use the default role. This is
  # the same name as the operating system user running Rails.
  #username: syndicate_development_2026

  # The password associated with the PostgreSQL role (username).
  #password:

  # Connect on a TCP socket. Omitted by default since the client uses a
  # domain socket that doesn't need configuration. Windows does not have
  # domain sockets, so uncomment these lines.
  #host: localhost

  # The TCP port the server listens on. Defaults to 5432.
  # If your server runs on a different port number, change accordingly.
  #port: 5432

  # Schema search path. The server defaults to $user,public
  #schema_search_path: myapp,sharedapp,public

  # Minimum log levels, in increasing order:
  #   debug5, debug4, debug3, debug2, debug1,
  #   log, notice, warning, error, fatal, and panic
  # Defaults to warning.
  #min_messages: notice

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: syndicate_development_2026_test

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Connection URLs for non-primary databases can also be configured using
# environment variables. The variable name is formed by concatenating the
# connection name with `_DATABASE_URL`. For example:
#
#   CACHE_DATABASE_URL="postgres://cacheuser:cachepass@localhost/cachedatabase"
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
# Staging deliberately runs a single primary database. That is a simplification, not a
# workaround: staging does not run Solid Cache, Queue or Cable — config/environments/
# staging.rb leaves cache_store and the job adapter at their defaults and config/cable.yml
# uses the async adapter — so none of the extra connections production declares below would
# be used. The schema files those connections load (db/cache_schema.rb and friends) are in
# the repo, so staging can be upgraded to mirror production whenever rehearsing that setup
# becomes worthwhile.
staging:
  <<: *default
  database: <%= ENV.fetch("STAGING_DATABASE_NAME", "syndicate_development_2026_staging") %>
  username: <%= ENV.fetch("STAGING_DATABASE_USER", "syndicate_development_2026") %>
  password: <%= ENV["STAGING_DATABASE_PASSWORD"] %>
  host: <%= ENV.fetch("STAGING_DATABASE_HOST", "localhost") %>

production:
  primary: &primary_production
    <<: *default
    database: syndicate_development_2026_production
    username: syndicate_development_2026
    password: <%= ENV["SYNDICATE_DEVELOPMENT_2026_DATABASE_PASSWORD"] %>
  # The three databases below are created and loaded by `bin/rails db:prepare` from
  # db/cache_schema.rb, db/queue_schema.rb and db/cable_schema.rb, which Rails resolves
  # by convention from the connection name (<name>_schema.rb).
  #
  # The `migrations_paths` directories below are intentionally absent from the repo.
  # Rails treats an empty/missing migrations path as "no migrations", which is correct:
  # these schemas are owned by the solid_* gems and are replaced wholesale on upgrade
  # via `bin/rails generate solid_queue:install` (and friends), not evolved by hand.
  #
  # Development and test deliberately stay on a single primary database: development
  # uses :memory_store and the :async job adapter, so it needs no cache or queue
  # database and no running worker.
  cache:
    <<: *primary_production
    database: syndicate_development_2026_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: syndicate_development_2026_production_queue
    migrations_paths: db/queue_migrate
    # Solid Queue wants at least `threads` + 2 connections per worker process — as of
    # 1.6.0 an undersized pool logs a warning and boots rather than aborting. This
    # must NOT inherit RAILS_MAX_THREADS from *default: that knob sizes Puma's web pool
    # and config/puma.rb already defaults it to 3, so an operator reconciling the two
    # would silently starve the workers. JOB_THREADS drives both this pool and `threads:`
    # in config/queue.yml, so the two cannot drift apart.
    max_connections: <%= ENV.fetch("JOB_THREADS", 3).to_i + 2 %>
  cable:
    <<: *primary_production
    database: syndicate_development_2026_production_cable
    migrations_paths: db/cable_migrate
