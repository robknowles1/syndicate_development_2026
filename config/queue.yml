default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      # Paired with the queue pool in config/database.yml, which is JOB_THREADS + 2.
      # Raise them together or the workers will starve for connections.
      threads: <%= ENV.fetch("JOB_THREADS", 3).to_i %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
