name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: |
          bin/rails db:test:prepare
          bundle exec rspec --exclude-pattern "spec/system/**/*"

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: |
          bin/rails db:test:prepare
          bundle exec rspec spec/system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Auto-deploys main to the OVH staging box. Runbook, including the six
  # repository secrets this needs: docs/deployment/ovh-server-access.md.
  deploy_staging:
    runs-on: ubuntu-latest
    needs: [ scan_ruby, scan_js, lint, test, system-test ]

    timeout-minutes: 30

    permissions:
      contents: read

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # cancel-in-progress MUST stay false: killing a deploy mid-flight can strand
    # the box between releases, which is worse than making the next merge wait.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      # Not redundant with db/seeds.rb's own guard: that one raises inside the
      # container after `db:prepare` has created the databases, and a redeploy
      # does not retry seeding. The 12/72 bounds are a third encoding of
      # AdminUser::MINIMUM_PASSWORD_LENGTH and bcrypt's limit — update together.
      - name: Verify deploy secrets are usable
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
        run: |
          fail=0

          # Keep the `return 0`. Without it this function's status is whatever
          # its last command left behind, and under `bash -e` a perfectly FINE
          # secret would abort the step at the call site.
          require_present() {
            if [ -z "${!1}" ]; then
              echo "::error::$1 is unset or empty. Set it under Settings > Secrets and variables > Actions."
              fail=1
            fi
            return 0
          }

          for secret_name in \
            DEPLOY_SSH_PRIVATE_KEY \
            RAILS_MASTER_KEY \
            KAMAL_REGISTRY_PASSWORD \
            RESEND_API_KEY \
            ADMIN_SEED_PASSWORD \
            STAGING_DATABASE_PASSWORD
          do
            require_present "$secret_name"
          done

          # The minimum is in CHARACTERS and the maximum in BYTES, matching how
          # the app enforces each — collapsing them onto one `wc` flag waves
          # through a multi-byte value that db/seeds.rb then rejects mid-deploy.
          # `wc -m` needs the UTF-8 locale to count characters at all.
          if [ -n "$ADMIN_SEED_PASSWORD" ]; then
            seed_password_chars=$(printf '%s' "$ADMIN_SEED_PASSWORD" | LC_ALL=C.UTF-8 wc -m)
            seed_password_bytes=$(printf '%s' "$ADMIN_SEED_PASSWORD" | wc -c)

            if [ "$seed_password_chars" -lt 12 ]; then
              echo "::error::ADMIN_SEED_PASSWORD is shorter than AdminUser::MINIMUM_PASSWORD_LENGTH (12 characters). db/seeds.rb would raise mid-deploy, after the databases were created but before any admin was seeded."
              fail=1
            elif [ "$seed_password_bytes" -gt 72 ]; then
              echo "::error::ADMIN_SEED_PASSWORD is longer than 72 bytes, which bcrypt rejects. db/seeds.rb would raise mid-deploy, after the databases were created but before any admin was seeded."
              fail=1
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Pre-flight failed. Fix the secrets named above and re-run this job; no values were printed."
            exit 1
          fi

          echo "All six deploy secrets are present, and ADMIN_SEED_PASSWORD is at least 12 characters and at most 72 bytes."

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pins the server's SSH host key; MUST stay ahead of the ssh-agent step.
      # If a deploy fails on a fingerprint mismatch, do NOT delete or loosen this
      # to make the build go away — that hands every deploy secret to whatever
      # answers on port 22. Rotation procedure is in
      # docs/deployment/ovh-server-access.md.
      - name: Pin staging host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo '15.204.81.231 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO7d8CnD/k4Jd9hcsDTuPzFPYEk986iWyKwNlxtGUrtK' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Not redundant with the line above: a mistyped known_hosts entry does
          # not error, it silently reverts net-ssh to accept-new. Same key in two
          # encodings — rotate both together.
          ssh-keygen -lF 15.204.81.231 -f ~/.ssh/known_hosts \
            | grep -q 'SHA256:nuYrtS7SlRAtC7Eoa0XsIZvM+EQC9bDCn/McENOBIPo'

      - name: Add SSH deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Deploy to staging with Kamal
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
        run: bin/kamal deploy -d staging
