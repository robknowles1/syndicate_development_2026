name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: |
          bin/rails db:test:prepare
          bundle exec rspec --exclude-pattern "spec/system/**/*"

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: |
          bin/rails db:test:prepare
          bundle exec rspec spec/system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Auto-deploys main to the OVH staging box once every other job is green.
  #
  # This job is expected to SUCCEED. A red build here is a real failure — read
  # the logs, do not wave it through.
  #
  # It needs six repository secrets under Settings > Secrets and variables >
  # Actions; they are named in the pre-flight step below and tabulated, with
  # their purposes, in docs/deployment/ovh-server-access.md.
  deploy_staging:
    runs-on: ubuntu-latest
    needs: [ scan_ruby, scan_js, lint, test, system-test ]

    # A deploy takes 10-15 minutes. 30 leaves headroom without letting a wedged
    # run sit on the concurrency group below for the 6-hour default and block
    # every later merge behind it.
    timeout-minutes: 30

    # ghcr.io is authenticated with KAMAL_REGISTRY_PASSWORD, a PAT, so this job
    # needs nothing from GITHUB_TOKEN beyond reading the repo for the checkout.
    permissions:
      contents: read

    # Push-to-main only. pull_request events run with github.ref =
    # refs/pull/N/merge, so a PR targeting main fails both halves and never
    # deploys.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Serialise deploys. Two Kamal runs against one host race over the same
    # container names and proxy config. cancel-in-progress MUST stay false:
    # killing a deploy mid-flight can strand the box between releases, which is
    # worse than making the next merge wait.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      # PRE-FLIGHT. Refuses to deploy when a required secret is unset, empty, or
      # — for ADMIN_SEED_PASSWORD — the wrong length. Deliberately the FIRST
      # step: it needs no checkout and no Ruby, so a misconfigured repository
      # fails in seconds without loading an SSH key or touching the server.
      #
      # Do not drop this as redundant. db/seeds.rb guards ADMIN_SEED_PASSWORD
      # too, but it raises INSIDE the container, after `db:prepare` has already
      # created the databases — and a redeploy with a corrected value does not
      # retry seeding, so recovery is a manual db:seed on the box. Two checks of
      # one rule at two very different costs, deliberately.
      #
      # The bounds below are a THIRD encoding of that rule and must be updated
      # with it: app/models/admin_user.rb sets MINIMUM_PASSWORD_LENGTH = 12, and
      # has_secure_password caps input at 72 bytes. They are measured in
      # different units on purpose — see docs/deployment/ovh-server-access.md.
      #
      # No secret value is ever printed, nor any prefix, nor any length — only
      # names. The counts below go through `wc`, which emits a number and never
      # the input.
      - name: Verify deploy secrets are usable
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
        run: |
          fail=0

          # The explicit `return 0` pins the exit STATUS. Append a trailing test
          # or an `&&` list to this function later and, without it,
          # require_present would return non-zero for a secret that is perfectly
          # FINE — and `bash -e` would abort the step at the call site, on the
          # good path.
          require_present() {
            if [ -z "${!1}" ]; then
              echo "::error::$1 is unset or empty. Set it under Settings > Secrets and variables > Actions."
              fail=1
            fi
            return 0
          }

          for secret_name in \
            DEPLOY_SSH_PRIVATE_KEY \
            RAILS_MASTER_KEY \
            KAMAL_REGISTRY_PASSWORD \
            RESEND_API_KEY \
            ADMIN_SEED_PASSWORD \
            STAGING_DATABASE_PASSWORD
          do
            require_present "$secret_name"
          done

          # Length is checked only when a value is present; an empty value is
          # already reported above and would otherwise produce two errors for
          # one cause.
          #
          # The minimum is in CHARACTERS and the maximum in BYTES, matching how
          # the app enforces each. `wc -c` is bytes regardless of locale; `wc -m`
          # is characters only under a UTF-8 locale, hence the explicit LC_ALL on
          # that one line. Neither prints the value. printf '%s' avoids the
          # trailing newline `echo` would add and count.
          if [ -n "$ADMIN_SEED_PASSWORD" ]; then
            seed_password_chars=$(printf '%s' "$ADMIN_SEED_PASSWORD" | LC_ALL=C.UTF-8 wc -m)
            seed_password_bytes=$(printf '%s' "$ADMIN_SEED_PASSWORD" | wc -c)

            if [ "$seed_password_chars" -lt 12 ]; then
              echo "::error::ADMIN_SEED_PASSWORD is shorter than AdminUser::MINIMUM_PASSWORD_LENGTH (12 characters). db/seeds.rb would raise mid-deploy, after the databases were created but before any admin was seeded."
              fail=1
            elif [ "$seed_password_bytes" -gt 72 ]; then
              echo "::error::ADMIN_SEED_PASSWORD is longer than 72 bytes, which bcrypt rejects. db/seeds.rb would raise mid-deploy, after the databases were created but before any admin was seeded."
              fail=1
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Pre-flight failed. Fix the secrets named above and re-run this job; no values were printed."
            exit 1
          fi

          echo "All six deploy secrets are present, and ADMIN_SEED_PASSWORD is at least 12 characters and at most 72 bytes."

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pins the staging server's SSH host key. MUST stay ahead of the ssh-agent
      # step so net-ssh has a known entry before the first connection.
      #
      # Kamal leaves net-ssh's `verify_host_key` unset, which maps to a verifier
      # that accepts whatever key an UNKNOWN host offers. Every GitHub runner is
      # fresh, so without this pin every deploy is a first contact and anything
      # answering on 15.204.81.231:22 receives RAILS_MASTER_KEY and every other
      # secret in the deploy step below. With the entry present the host is no
      # longer unknown and a mismatched key raises HostKeyMismatch, stopping the
      # deploy instead of handing the secrets over.
      #
      # The value is committed rather than held in a secret because it is a
      # PUBLIC key — the server presents it to every client — and because an
      # unset secret would write an empty file and drop silently back to
      # accept-new. Verified 2026-07-28.
      #
      # ── IF A DEPLOY FAILS WITH "fingerprint ... does not match" ─────────────
      # Either the server was rebuilt (its host key is generated at first boot)
      # or the connection is being intercepted. Do NOT delete or loosen this to
      # make the red build go away — that restores the exact hole it closes.
      # The rotation procedure, including how to tell those two cases apart and
      # what else a rebuild destroys, is in docs/deployment/ovh-server-access.md
      # under "A deploy fails with a host-key fingerprint mismatch".
      - name: Pin staging host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo '15.204.81.231 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO7d8CnD/k4Jd9hcsDTuPzFPYEk986iWyKwNlxtGUrtK' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Fail here, not mid-deploy, if the line above is ever mistyped. A
          # corrupt key does not error — net-ssh skips the unparseable entry,
          # finds no keys for the host, and quietly reverts to accept-new. This
          # turns that silent downgrade into a red step. This SHA256 and the
          # known_hosts line above encode the same key: rotate them together.
          ssh-keygen -lF 15.204.81.231 -f ~/.ssh/known_hosts \
            | grep -q 'SHA256:nuYrtS7SlRAtC7Eoa0XsIZvM+EQC9bDCn/McENOBIPo'

      # Client half of the SSH handshake — the deploy key for
      # ubuntu@15.204.81.231. The host half is pinned by the step above.
      - name: Add SSH deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      # RAILS_MASTER_KEY is required here specifically: config/master.key is
      # gitignored and absent on the runner, so .kamal/secrets-common falls back
      # to this variable. STAGING_DATABASE_PASSWORD is fanned out by
      # .kamal/secrets.staging to the two names staging needs.
      - name: Deploy to staging with Kamal
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
        run: bin/kamal deploy -d staging
